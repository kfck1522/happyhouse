.090 6 3.080a7.200 7.200 0 0 1-6 3.220z"/></svg></div></div>${hb}</div><div id="ring"><div class="av" style="${I.avatar?`background-image:url(${I.avatar})`:""}">${I.avatar?"":ini(I.callerName).toUpperCase()}</div><h2>${I.callerName}</h2><p id="igc" style="margin-top:8px;opacity:.8"></p><p id="rt" style="margin-top:26px;opacity:.6"></p><div class="btns"><button class="cb r" onclick="goHome()">${B_END}</button><button class="cb gn" onclick="accept()">${B_ACC}</button></div></div>
<div id="call"><video id="rv" src="${I.video}" loop muted playsinline></video><div id="top"><b>${I.callerName}</b><span id="ctm">00:00</span></div><div id="pip"><video id="sv" src="${I.selfVideo||""}" loop muted playsinline autoplay></video></div><div id="cm"></div><div id="ci"><input id="cin"></div><div class="btns"><button class="cb">${B_FLIP}</button><button class="cb" onclick="this.classList.toggle('off')">${B_MIC}</button><button class="cb" onclick="this.classList.toggle('off')">${B_VID}</button><button class="cb r" onclick="goHome()">${B_END}</button></div></div>`;

<div id="mini" onclick="$('#full').classList.add('on')"><div class="cv2" id="mcv"></div><div style="flex:1;font-size:14px"><b id="mt"></b><br><small id="ma" style="color:#ddd"></small></div><span id="mp" style="font-size:22px;padding:0 8px" onclick="event.stopPropagation();tg()">⏸</span><div class="mb"><i id="mbi"></i></div></div>

$("#fr").oninput=e=>{pos=e.target.value/100*dur();if(au)au.currentTime=pos;ui()}}
function play(i){si=i;pos=0;const s=sg[i];if(au){au.pause();au=null}if(s.audio){au=new Audio(s.audio);au.play().catch(()=>{})}playing=true;document.querySelectorAll(".sg").forEach((e,k)=>{e.classList.toggle("on",k===i);e.querySelector("b").dataset.p=k===i?"1":""});$("#mini").classList.add("on");{const c=s.cover||S.cover;$("#mcv").style.background=$("#fcv").style.background=c?`url(${c}) center/cover`:""}$("#mt").textContent=$("#ft").textContent=s.title;$("#ma").textContent=$("#fa").textContent=s.artist;$("#fd").textContent=fmt(dur());clearInterval(iv);iv=setInterval(step,250);ui()}
